# Monthly grouped dependency update PRs; the cooldown skips releases younger than a week.

version: 2
updates:
  # The root entry covers every workspace: they share the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
    # Pinned on purpose: see the root CLAUDE.md.
    ignore:
      - dependency-name: typescript
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # Actions are pinned to commit SHAs, since CI holds a secret; this keeps the pins current.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
