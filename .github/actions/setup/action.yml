name: Setup
description: Set up Node.js and install every workspace's dependencies from the root lockfile

# TODO: pin actions to commit SHAs once CI uses secrets or a third-party action.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    # From the root on purpose: inside an app directory, npm installs only that app's dependencies.
    - run: npm ci
      shell: bash
