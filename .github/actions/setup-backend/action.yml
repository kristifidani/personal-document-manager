name: Setup backend
description: Set up Node.js and install apps/backend dependencies

# Future consideration (not required now):
# Pin third-party actions to full commit SHAs instead of mutable tags.
# Verify the SHA against the corresponding release before bumping the version.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: apps/backend/package-lock.json

    - run: npm ci
      shell: bash
      working-directory: apps/backend
