name: Setup backend
description: Set up Node.js and install apps/backend dependencies

# TODO: pin actions to commit SHAs once CI uses secrets or a third-party action.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: apps/backend/package-lock.json

    - run: npm ci
      shell: bash
      working-directory: apps/backend
