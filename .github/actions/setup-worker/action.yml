name: Setup worker
description: Set up Node.js and install apps/worker dependencies

# TODO: pin actions to commit SHAs once CI uses secrets or a third-party action.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: apps/worker/package-lock.json

    - run: npm ci
      shell: bash
      working-directory: apps/worker
