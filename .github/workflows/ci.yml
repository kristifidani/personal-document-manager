name: CI

# Runs once per PR update and once more when the PR is merged to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per branch/PR; a newer push cancels the older PR run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [backend, worker]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build

  # Repo-wide, so it runs once: the apps share one lockfile, and knip checks every workspace.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm audit --audit-level=high
      - run: npx knip

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [backend, worker]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [backend, worker]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: personal_document_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/personal_document_manager
      # Absolute, so the backend's reset (run from apps/backend) and the worker see the same directory.
      STORAGE_DIR: /tmp/pdm-storage
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The backend owns the schema, so every app's tests migrate through it.
      - run: npm run migrate:up
        working-directory: apps/backend
      # Round-trip: roll back every migration and re-apply, so down migrations are tested too.
      - if: matrix.app == 'backend'
        run: npm run migrate:down -- "$(ls migrations/*.sql | wc -l)" && npm run migrate:up
      - run: npm test
